[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dns-covert-channel-research"
version = "0.1.0"
description = "DNS covert channel research: dual-sided exfiltration and detection"
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.5.0",
    "dpkt>=1.9.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["exfil", "detection", "evasion", "analysis"]
omit = ["tests/*"]
